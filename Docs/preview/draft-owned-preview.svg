<rect x="416" y="132" width="48" height="48" rx="10" fill="#262052" stroke="#B79CFF" stroke-width="3"/>
<text x="440" y="164" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="bold" fill="#B79CFF" text-anchor="middle">공</text>
<rect x="478" y="132" width="48" height="48" rx="10" fill="none" stroke="#3A3172" stroke-width="2" stroke-dasharray="5 4"/>
