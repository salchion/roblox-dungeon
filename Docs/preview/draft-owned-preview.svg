<rect x="602" y="132" width="48" height="48" rx="10" fill="none" stroke="#3A3172" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="664" y="132" width="48" height="48" rx="10" fill="none" stroke="#3A3172" stroke-width="2" stroke-dasharray="5 4"/>
<text x="745" y="154" font-family="Noto Sans CJK KR, sans-serif" font-size="15" font-weight="normal" fill="#A9A2D0" text-anchor="start">덱 칸: 지금 카드와 같은 갈래는 테두리가 깜빡인다</text>
<text x="745" y="176" font-family="Noto Sans CJK KR, sans-serif" font-size="14" font-weight="normal" fill="#A9A2D0" text-anchor="start">(예: 폭발 카드를 가리키면 덱의 폭 2칸이 반짝)</text>
<rect x="60" y="230" width="340" height="460" rx="24" fill="#1A1830" stroke="#7FD0FF" stroke-width="3"/>
<rect x="60" y="230" width="340" height="10" rx="5" fill="#7FD0FF"/>
<circle cx="230" cy="335" r="54" fill="#262052" stroke="#7FD0FF" stroke-width="3"/>
<text x="230" y="352" font-family="Noto Sans CJK KR, sans-serif" font-size="46" font-weight="bold" fill="#7FD0FF" text-anchor="middle">+</text>
<text x="230" y="435" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">공격력 +12%</text>
<text x="230" y="480" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#CDC8E6" text-anchor="middle">새 강화</text>
<text x="230" y="508" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#CDC8E6" text-anchor="middle">(아직 안 고름)</text>
<rect x="430" y="230" width="340" height="460" rx="24" fill="#1A1830" stroke="#B79CFF" stroke-width="3"/>
<rect x="430" y="230" width="340" height="10" rx="5" fill="#B79CFF"/>
<circle cx="600" cy="335" r="54" fill="#262052" stroke="#B79CFF" stroke-width="3"/>
