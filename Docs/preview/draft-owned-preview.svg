<text x="600" y="435" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">관통탄</text>
<text x="600" y="480" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#CDC8E6" text-anchor="middle">탄이 적 1마리를 더 관통</text>
<text x="600" y="508" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#CDC8E6" text-anchor="middle">(이미 1장 -> 이번에 x2)</text>
<path d="M424 256 h150 l-14 22 l14 22 h-150 z" fill="#B79CFF"/>
<text x="438" y="286" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="bold" fill="#100C22" text-anchor="start">보유 x1</text>
<rect x="460" y="600" width="280" height="66" rx="14" fill="#100C22" stroke="#B79CFF" stroke-width="2"/>
<circle cx="490" cy="622" r="11" fill="#B79CFF" stroke="#B79CFF" stroke-width="2"/>
<circle cx="534" cy="622" r="11" fill="#B79CFF" opacity="0.45" stroke="#B79CFF" stroke-width="2"/>
<circle cx="578" cy="622" r="11" fill="none" stroke="#B79CFF" stroke-width="2"/>
<text x="600" y="656" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" fill="#B79CFF" text-anchor="middle">x1 -> x2 (최대 x3)</text>
<text x="748" y="278" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="bold" fill="#B79CFF" text-anchor="end">x2</text>
<rect x="792" y="222" width="356" height="476" rx="30" fill="none" stroke="#FF8A3C" stroke-width="6" opacity="0.35"/>
<rect x="800" y="230" width="340" height="460" rx="24" fill="#1A1830" stroke="#FF8A3C" stroke-width="4"/>
<rect x="800" y="230" width="340" height="10" rx="5" fill="#FF8A3C"/>
<circle cx="970" cy="335" r="54" fill="#262052" stroke="#FF8A3C" stroke-width="3"/>
<text x="970" y="352" font-family="Noto Sans CJK KR, sans-serif" font-size="46" font-weight="bold" fill="#FF8A3C" text-anchor="middle">!</text>
<text x="970" y="435" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">폭발 갈래</text>
<text x="970" y="480" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#CDC8E6" text-anchor="middle">처치하면 주변 폭발</text>
<text x="970" y="508" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#CDC8E6" text-anchor="middle">다음 단계: 폭발 반경 +30%</text>
<path d="M794 256 h150 l-14 22 l14 22 h-150 z" fill="#FF8A3C"/>
<text x="808" y="286" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="bold" fill="#100C22" text-anchor="start">2단계 보유</text>
<rect x="830" y="600" width="280" height="66" rx="14" fill="#100C22" stroke="#FF8A3C" stroke-width="2"/>
<circle cx="860" cy="622" r="11" fill="#FF8A3C" stroke="#FF8A3C" stroke-width="2"/>
<circle cx="904" cy="622" r="11" fill="#FF8A3C" stroke="#FF8A3C" stroke-width="2"/>
<circle cx="948" cy="622" r="11" fill="#FF8A3C" opacity="0.45" stroke="#FF8A3C" stroke-width="2"/>
<circle cx="992" cy="622" r="11" fill="none" stroke="#FF8A3C" stroke-width="2"/>
<text x="970" y="656" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" fill="#FF8A3C" text-anchor="middle">2단계 -> 3단계 · 4번째 = 최종 기술</text>
<rect x="40" y="720" width="1120" height="250" rx="18" fill="#1E1A40" stroke="#100C22" stroke-width="3"/>
<text x="70" y="765" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#F2EEFF" text-anchor="start">- 왼쪽 위 리본: 이미 가진 수 ("보유 x1" / "2단계 보유") — 처음 보는 카드는 리본 없음</text>
<text x="70" y="807" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#F2EEFF" text-anchor="start">- 아래 단계 점: 채운 점 = 이미 가진 단계, 흐린 점 = 이번에 고르면 오를 단계</text>
<text x="70" y="849" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#F2EEFF" text-anchor="start">- 갈래 카드는 바깥 빛 테두리 + 갈래 색: 덱에서 같은 갈래 칸이 반짝</text>
<text x="70" y="891" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#F2EEFF" text-anchor="start">- 서버가 카드에 '이미 가진 수 / 최대 / 다음 단계 이름'을 같이 보낸다 (지금은 이름 / 설명만 보냄)</text>
<text x="70" y="933" font-family="Noto Sans CJK KR, sans-serif" font-size="19" font-weight="normal" fill="#F2EEFF" text-anchor="start">- 필드 세트 효과 카드에도 같은 리본을 쓸 수 있다 (선택)</text>
</svg>
