<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="1200" height="1000" fill="#14112B"/>
<text x="40" y="60" font-family="Noto Sans CJK KR, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="start">던전 드래프트: 이미 고른 강화 표시 (시안 · 코드 미반영)</text>
<text x="40" y="94" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="normal" fill="#A9A2D0" text-anchor="start">같은 갈래 / 같은 강화를 또 고르면 단계가 오른다 -> 카드에서 바로 보이게 (롤 증강 세트 표시 참고)</text>
